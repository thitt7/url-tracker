# Build/push .NET API image for VPS staging (Docker Hub tag :staging).
# Does not deploy to Kubernetes.

name: deploy-dotnet-staging

on:
  workflow_dispatch:
  push:
    branches: ["staging"]
    paths:
      - "src/url/**"

env:
  REGISTRY_IMAGE: thitt7/dotnet
  DOCKERFILE: src/url/Dockerfile
  IMAGE_TAG: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Build and push staging image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
