name: deploy-dotnet-staging

on:
  workflow_dispatch:
  push:
    branches: [ "staging" ]
    paths: 
      - 'src/url/**'

env:
  REGISTRY_IMAGE: thitt7/dotnet
  DOCKERFILE: src/url/Dockerfile
  IMAGE_TAG: staging
  COMPOSE_CMD: docker compose -p url-tracker-staging --env-file .env.staging -f docker-compose.staging.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Build and push staging image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}

          envs: REGISTRY_IMAGE,IMAGE_TAG,COMPOSE_CMD

          script: |
            IMAGE="${REGISTRY_IMAGE}:${IMAGE_TAG}"

            cd /url-tracker

            # Re-declare for reliability inside SSH
            COMPOSE_CMD="docker compose -p url-tracker-staging --env-file .env.staging -f docker-compose.staging.yml"

            echo "Pulling dotnet image: $IMAGE"
            docker pull "$IMAGE"

            echo "Deploying dotnet service..."
            $COMPOSE_CMD up -d --no-deps url

            echo "Cleaning up old images..."
            docker image prune -f