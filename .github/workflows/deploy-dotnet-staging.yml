name: deploy-dotnet-staging

on:
  workflow_dispatch:
  push:
    branches: [ "staging" ]
    paths: 
    - 'src/url/**'

env:
  REGISTRY_IMAGE: thitt7/dotnet
  DOCKERFILE: src/url/Dockerfile
  IMAGE_TAG: staging
  COMPOSE_CMD: docker compose --env-file .env.vps -f docker-compose.vps.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Build and push staging image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script: |
            cd /url-tracker

            echo "Pulling latest images..."
            OUTPUT=$($COMPOSE_CMD pull)

            if echo "$OUTPUT" | grep -q "Downloaded newer image"; then
              echo "New image found, deploying..."
              $COMPOSE_CMD up -d --remove-orphans
            else
              echo "No changes, skipping restart."
            fi

            echo "Cleaning up old images..."
            docker image prune -f