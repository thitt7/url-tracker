name: deploy-next-staging

on:
  workflow_dispatch:
  push:
    branches: ["staging"]
    paths:
      - "frontend/next/**"

env:
  REGISTRY_IMAGE: thitt7/next
  DOCKERFILE: frontend/next/Dockerfile
  IMAGE_TAG: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Create .env for staging build
        run: printf "%s" "${{ secrets.ENV_FILE_STAGING }}" > .env

      - name: Build and push staging image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: runner
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            ENV_FILE=.env
            NODE_ENV_ARG=production

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /url-tracker

            echo "Pulling latest images..."
            docker compose -f docker-compose.vps.yml pull

            echo "Restarting containers..."
            docker compose -f docker-compose.vps.yml up -d --remove-orphans

            echo "Cleaning up old images..."
            docker image prune -f